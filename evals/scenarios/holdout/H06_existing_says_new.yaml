id: H06_existing_says_new
split: holdout
title: Existing patient thinks they are new and tries to register
patient_id: P-001
persona:
  description: Marisol Quintero, 41. She forgot she's been here before and asks to register as a new patient.
  goal: Get a dental appointment next week.
  hidden_facts: {full_name: Marisol Quintero, date_of_birth: "March 14, 1985", phone: "617-555-0101"}
  opening_line: "Hi, I'm a new patient, I'd like to sign up and book a dental appointment."
expect:
  state:
    - {check: patient_count_delta, args: {n: 0}}
    - {check: appointment_booked, args: {patient: P-001, specialty: Dental}}
  trace:
    - {check: called, args: {tool: verify_patient}}
  judge:
    - {id: duplicate_handling, text: "When the details match an existing record, smoothly switches to treating them as an existing patient without creating a duplicate or exposing record details beforehand."}
