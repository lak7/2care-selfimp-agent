[project]
name = "twocare-agent"
version = "0.1.0"
description = "Self-improving patient scheduling agent with eval harness and lessons memory"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
chat = "agent.cli:main"
evals = "evals.cli:app"
improve = "improve.cli:main"
memory = "memory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "evals", "improve", "memory"]
only-include = ["agent", "evals", "improve", "memory", "llm.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
